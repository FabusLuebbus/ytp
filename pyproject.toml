[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytp"
version = "0.1.0"
description = "A terminal YouTube audio player"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabian" }]
dependencies = ["blessed>=1.20"]

[project.scripts]
ytp = "ytp.cli:main"

[dependency-groups]
dev = [
  "pip-audit>=2.8",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
